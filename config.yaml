# Конфигурация полосы «Система». Пути — относительно этого файла либо абсолютные (~ раскрывается).
#
# ПУТЕЙ ВОЛЬТА ЗДЕСЬ НЕТ. Они приходят только из окружения:
#   ALTREGO_VAULT_CLONE  — клон вольта (читается, канал свежести 1)
#   ALTREGO_VAULT_MASTER — рабочая копия вольта (читается, канал свежести 2)
# Другого источника нет, умолчания нет, отката на путь владельца нет: репозиторий
# не носит машину владельца. Переменная не задана — типизированный отказ опоры
# vault_env_unset (канал 1 красный, канал 2 предупреждение), а не молчаливый
# зелёный на неверном пути. `run.py --fast` вольта не касается и работает при
# обеих снятых — этим и держится гейт CI, где вольта нет.
vault:
  # Клон вольта только читается. Перед прогоном --full владелец делает:
  #   git -C "$ALTREGO_VAULT_CLONE" pull --ff-only
  # --full сам меряет свежесть: git -C "$ALTREGO_VAULT_CLONE" fetch и сравнение
  # HEAD с удалённой веткой. Отставание = красный класса infra
  # (clone_behind_vault): хэши по отставшему клону ничего не говорят о каноне.
  # Fetch трогает только remote-ссылки клона, рабочее дерево вольта не меняется.

  # Второй канал свежести. Сравнение клона с его remote зеленеет, пока правки
  # канона лежат в рабочей копии вольта незакоммиченными: клон свеж относительно
  # origin, а канон, по которому считаются хэши, уже другой. Поэтому --full
  # читает и саму рабочую копию: `git -C "$ALTREGO_VAULT_MASTER" status
  # --porcelain` и `git -C "$ALTREGO_VAULT_MASTER" rev-parse HEAD`. Оба вызова
  # читающие, вольт не меняется.
  # Красным канал 2 считает расхождение по файлам, названным в
  # rules[].source.file: набор выводится из реестра в момент прогона (run.py,
  # registry_source_files). Незакоммиченная правка связанного файла — красный
  # infra (vault_uncommitted); HEAD рабочей копии впереди клона по связанному
  # файлу — красный infra (vault_ahead_of_clone). Правка прочего пути canon_paths
  # (запись оркестратора в 00-system/log.md) даёт предупреждение
  # vault_uncommitted_unbound / vault_ahead_unbound: ни один content_hash реестра
  # от неё не зависит, и красить прогон ей нечем. Триггер по инварианту, а не по
  # форме пути. Состав правки, клону неизвестной (коммит не запушен), не измерен —
  # там сужать нечем, и красный остаётся. Свидетельство печатается целиком: оба
  # перечня, связанный и прочий, названы раздельно.
  # Путь недоступен (не WSL, диск не смонтирован, git отказал) — предупреждение
  # infra (vault_master_unreachable): свежесть не измерена, а не подтверждена.
  # Переменная не задана — то же предупреждение под именем vault_env_unset.

  # Пути канона внутри вольта: изменения вне них на хэши реестра не влияют.
  # Внутри них решает уже не путь, а связанность с реестром (см. выше).
  canon_paths:
    - 00-system/
    - 01-theygrow/operations/
    - 02-synthesis/

# Лимиты механики прогона. Отказ контролёра есть отказ хода, а не разрешение
# (несущий документ, слой 0, п. 5), поэтому лимит времени на вызов чекера задан
# здесь, а не умолчанием в коде: «ключ не задан» и «лимит снят» должны быть
# различимы, и оба краснеют (infra config_invalid_limit).
#
# Меряется CPU-время процесса (time.process_time) вокруг единственной точки
# вызова check(), а не стенные часы: чекер — чистая функция без сети и файловых
# эффектов, и приостановленный раннер CI не должен давать ложный красный.
# Прерывания вызова нет намеренно: единственный реалистичный отказ по времени —
# регэксп на уровне C, который сигналом не прерывается, а прогон, висящий вместо
# ответа, есть отсутствие ответа, а не отличимый провал (§11, «Исполнимость
# shell-блока», (3)). Вечный вызов отсекается слоем CI: timeout-minutes у job
# `gate` в .github/workflows/ci.yml.
#
# Значение 2 с при измеренном максимуме 0,357 мс на артефакт (live_channel_slot,
# прогон 2026-09-04) — запас около 5000×: лимит краснеет на зависании, а не на
# медленной машине.
limits:
  checker_timeout_seconds: 2

paths:
  registry: rules/registry.yaml
  scenarios: scenarios
  manifest: linter/manifest.yaml
  fixtures: linter/fixtures
  reports: reports

# Разбор канона: как из markdown-файла вольта вырезается «секция пункта».
# Уровни (см. linter/canon.py):
#   1 — markdown-заголовок (^#{1,6} )
#   2 — «пункт»: строка, начинающаяся с ** и стоящая первой в абзац-блоке
#       (перед ней пустая строка либо markdown-заголовок)
#   3 — продолжение пункта: строка с ** внутри того же блока (в секцию входит)
# Секция = от строки заголовка до строки перед следующим заголовком уровня <= 2.
# Уровень 2 расширен 2026-08-31 (v0 → v1): пунктом канона считается и элемент
# маркированного списка с жирным зачином (`- **Заголовок …**`). Повод — раздел
# «Правила использования» prompt-kit: он весь список, и оба заводимых правила
# (R-PROMPTKIT-019, R-SOURCES-020) стоят в нём этой формой; для v0 их не
# существовало, hash_rule возвращал UNRESOLVED. Расширение измерено: все 18
# пунктов реестра пересчитаны обоими разборами, ни один content_hash не
# изменился. Имя версии поднято, потому что сменилась форма разбора: по имени
# читается, каким разбором посчитан хэш в реестре.
canon:
  section_parser: bold_lead_v1

# Наблюдения прогона: пометка класса к находке, которая остаётся на месте.
# Наблюдение ничего не изымает и на вердикт не влияет — этим оно отличается от
# `<!-- lint:ignore … -->` (linter/ignores.py), снимающего находку. Форма нужна
# там, где находка разобрана и признана не подгоняемой порогом.
#
# self_reference — находка на строке, которая не поручает и не утверждает, а
# цитирует словарь самого чекера (пакет на его заведение, предсказание
# диспозиции). Порогом такое не чинится: сузить триггер под цитату — значит
# сузить его под настоящие поручения той же формы. Оставлено наблюдением.
#
# Список пуст с 2026-09-03. Обе записи этого класса стояли на
# `calibration/session.md` — строки 131 (owner_action_block) и 113
# (live_channel_slot). Калибровочный набор ушёл из репозитория в вольт:
# `05-inbox/archive/altrego-calibration-2026-08-31-09-01/` (адресуется через
# ALTREGO_VAULT_MASTER), и обе записи стали мёртвыми — прогон печатал по ним
# «совпало находок: 0» ещё до изъятия каталога. Наблюдение сопоставляется с
# находкой дословным путём (run.observe), подстановки переменных окружения в
# ключ `file` нет; заводить её ради двух мёртвых записей — новая механика на
# пустом месте. Форма наблюдения остаётся описанной выше и работает, как
# работала: разобранная находка помечается классом и остаётся на месте.
observations: []
