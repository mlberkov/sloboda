# Конфигурация полосы «Система». Пути — относительно этого файла либо абсолютные (~ раскрывается).
vault:
  # Клон вольта только читается. Перед прогоном --full владелец делает:
  #   git -C <clone_path> pull --ff-only
  # --full сам меряет свежесть: git -C <clone_path> fetch и сравнение HEAD с
  # удалённой веткой. Отставание = красный класса infra (clone_behind_vault):
  # хэши по отставшему клону ничего не говорят о каноне. Fetch трогает только
  # remote-ссылки клона, рабочее дерево вольта не меняется.
  clone_path: ~/vaults/theygrow-vault

  # Второй канал свежести. Сравнение клона с его remote зеленеет, пока правки
  # канона лежат в рабочей копии вольта незакоммиченными: клон свеж относительно
  # origin, а канон, по которому считаются хэши, уже другой. Поэтому --full
  # читает и саму рабочую копию: `git -C <master_path> status --porcelain` и
  # `git -C <master_path> rev-parse HEAD`. Оба вызова читающие, вольт не меняется.
  # Незакоммиченные изменения по canon_paths — красный infra (vault_uncommitted);
  # HEAD рабочей копии впереди клона — красный infra (vault_ahead_of_clone).
  # Путь недоступен (не WSL, диск не смонтирован, git отказал) — предупреждение
  # infra (vault_master_unreachable): свежесть не измерена, а не подтверждена.
  master_path: /mnt/d/Obsidian/TheyGrow

  # Пути канона внутри вольта: изменения вне них на хэши реестра не влияют.
  canon_paths:
    - 00-system/
    - 01-theygrow/operations/
    - 02-synthesis/

paths:
  registry: rules/registry.yaml
  scenarios: scenarios
  manifest: linter/manifest.yaml
  fixtures: linter/fixtures
  reports: reports

# Разбор канона: как из markdown-файла вольта вырезается «секция пункта».
# Уровни (см. linter/canon.py):
#   1 — markdown-заголовок (^#{1,6} )
#   2 — «пункт»: строка, начинающаяся с ** и стоящая первой в абзац-блоке
#       (перед ней пустая строка либо markdown-заголовок)
#   3 — продолжение пункта: строка с ** внутри того же блока (в секцию входит)
# Секция = от строки заголовка до строки перед следующим заголовком уровня <= 2.
canon:
  section_parser: bold_lead_v0

# Наблюдения прогона: пометка класса к находке, которая остаётся на месте.
# Наблюдение ничего не изымает и на вердикт не влияет — этим оно отличается от
# `<!-- lint:ignore … -->` (linter/ignores.py), снимающего находку. Форма нужна
# там, где находка разобрана и признана не подгоняемой порогом.
#
# self_reference — находка на строке, которая не поручает и не утверждает, а
# цитирует словарь самого чекера (пакет на его заведение, предсказание
# диспозиции). Порогом такое не чинится: сузить триггер под цитату — значит
# сузить его под настоящие поручения той же формы. Оставлено наблюдением.
observations:
  - file: calibration/session.md
    line: 131
    checker: owner_action_block
    class: self_reference
    note: >-
      Пункт пакета на заведение самого owner_action_block: глаголы «прогнать»,
      «закоммитить» стоят в нём как цитата словаря чекера, а не как поручение
      владельцу. Ложное срабатывание; порогом не чинится.
  - file: calibration/session.md
    line: 113
    checker: live_channel_slot
    class: self_reference
    note: >-
      Тот же класс, найден переписанным live_channel_slot 2026-08-31: строка
      предсказания диспозиции цитирует формы «Публикация прошла», «репозиторий
      создан» как примеры, а не утверждает о носителе. Ложное срабатывание;
      порогом не чинится.
