# Гейт полосы «Система» на свежем чекауте.
#
# Доказательство «прогон не требует вольта» здесь структурное. Пути вольта
# приходят только из переменных окружения ALTREGO_VAULT_CLONE и
# ALTREGO_VAULT_MASTER, умолчания на путь владельца в репозитории нет (мера —
# tests/test_vault_env.py), а шаг «вольт не адресован» проверяет, что обе
# переменные на раннере не заданы: адресовать вольт нечем, и зелёный job и есть
# доказательство. Литералов пути владельца здесь нет намеренно — иначе гейт
# нёс бы машину владельца в файле, из которого её и убирали.
# `run.py --full` тут не запускается: без адресованного клона он краснеет
# infra-статусом vault_env_unset — отсутствие опоры прогона, а не вердикт
# о предмете.
#
# КОНТРАКТ ИМЕНИ. Обязательной проверкой branch protection для main становится
# строка `gate` — имя job'а ниже. Оно задано полем `name:` (не выводится из
# ключа job'а и не зависит от имени этого файла), и матрица здесь не заводится:
# матрица дописала бы параметры в имя проверки («gate (3.12)»), и её смена молча
# сняла бы обязательную проверку — слияние прошло бы мимо гейта при формально
# включённой защите. Имя закреплено тестом tests/test_ci_contract.py.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Слой защиты от невозвращающегося вызова. Лимит чекера в config.yaml меряет
    # CPU-время после возврата и потому ловит медленный чекер, но не вечный:
    # регэксп на уровне C из Python не прерывается. Прерывание сигналом здесь не
    # заводится намеренно — оно этот случай тоже не покрывает, а прогон, висящий
    # вместо ответа, есть отсутствие ответа, а не отличимый провал (§11, (3)).
    # Значение: локально pytest 4,3 с и `run.py --fast` 0,16 с (измерено
    # 2026-09-04); в CI сверх этого установка venv, зависимостей и
    # `pre-commit run --all-files` со вторым прогоном pytest — ожидаемо 2–4 мин.
    # 10 мин — запас ×2,5–5 при отсечении вечного вызова за минуты вместо
    # 360 мин умолчания GitHub. Присутствие ключа закреплено
    # tests/test_ci_contract.py.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: вольт не адресован
        run: |
          test -z "${ALTREGO_VAULT_CLONE:-}"
          test -z "${ALTREGO_VAULT_MASTER:-}"
          echo "обе переменные вольта не заданы: прогоны ниже его не читают"

      - name: .venv как у владельца
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: .venv/bin/python -m pytest

      - name: pre-commit run --all-files
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

      - name: линтер без вольта
        run: .venv/bin/python run.py --fast linter/fixtures/green/*.md --no-report
