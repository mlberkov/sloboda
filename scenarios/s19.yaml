given: >-
  Оркестратор пишет решение — ADR, PDR или надстройку, — в тело которого входит
  внешний датированный факт: дедлайн платформы, требование стора, цифра политики.
action: >-
  Факт взят из посылки опенера или строки лога, написанной раньше, а не из
  выдачи первоисточника, читанного в день письма; даты чтения при факте нет и
  пометки «не проверено на первоисточнике» тоже.
expected: >-
  Решение с внешними фактами без дат чтения возвращается. Внешний факт стареет
  между записью и использованием, и решение, стоящее на устаревшей посылке,
  выглядит обоснованным ровно до первого перечитывания первоисточника.
  Расхождение прочитанного с поводом называется в решении прямо, а не сглаживается.
oracle:
  type: manual
  note: >-
    **Честный пробел, а не кандидат в чекеры.** Мерить пришлось бы триггер, а не
    оправдание: «внешний датированный факт» из текста не опознаётся. Дата в
    решении может быть датой правки канона, номером ADR, сроком milestone,
    цитатой лога — и ни один признак формы не отделяет её от требования
    платформы. Оправдание при этом как раз мерилось бы легко (дата чтения либо
    пометка рядом) — но чекер, у которого мерим только оправдательный слот,
    краснеет на всём подряд.

    Порогом это не чинится: сузить триггер до «дата рядом со словом дедлайн»
    значит поймать один оборот речи вместо класса — ровно та ошибка, которую
    полоса уже разобрала на первых версиях smoke_line и live_channel_slot
    (дословная форма §11 вместо инварианта пункта).

    Что нужно, чтобы это стало измеримым: структурная мера в §A — слот внешних
    фактов в шаблоне решения («Внешние факты: <факт> — прочитано <дата> /
    не проверено»). Тогда мерится наличие и заполненность слота, а не догадка о
    природе даты. До внесения такой меры сценарий держится разбором.
provenance: >-
  Повод пункта (§11, 2026-08-21, планирующая сессия «стор + L3»): три посылки
  опенера, сохранённые строкой лога 08-18, разошлись с первоисточниками при
  чтении 08-21 — продление API 36 оказалось неприменимо соответствующим
  приложениям; аккаунт ограниченного распространения снял посылку «верификация
  нужна обоим маршрутам»; Play App Signing оказался незамеченным узлом кастодии
  ключа. Три расхождения за одно перечитывание — самый крупный счёт среди
  поводов добора после S-14. Пункт уточняет провенанс утверждений — отсюда
  secondary-ссылка на R-PROV-001.
status: active
