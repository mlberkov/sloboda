id: S-08
class: К4
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-OWNERBLOCK-006
    role: primary
    hash_at_binding: "e8ab5de80abcfcb4c5508ab820cd58f56449a2ece196e98924ef1509d11453b0"
given: >-
  Handoff-артефакт хода несёт раздел «Ваши действия» — перечень, в который пункт
  канона требует собрать все действия владельца хода, по строке на действие.
action: >-
  Один из пунктов перечня поручает исполнить команду («прогнать», «закоммитить»,
  «выполнить», «запустить»), но огороженного блока не несёт — ни в себе, ни в
  следующем пункте: команда оставлена прозой.
expected: >-
  Красный на строке пункта. Копируемый блок — пункт перечня, а не замена ему;
  поручение прозой владелец либо собирает по памяти, либо пропускает, исполнив
  копируемый блок выше и сочтя ход закрытым. Это дословный «ловимый отказ»
  пункта. Блок засчитывается в том же пункте или в следующем: перечень часто
  пишется как строка-поручение, под ней блок, и блок оказывается отдельным
  абзацем-пунктом.
oracle:
  type: deterministic
  checker: owner_action_block
  note: >-
    Список глаголов и границы раздела — данные в linter/manifest.yaml,
    расширяются без правки модуля. Стартовый набор — четыре глагола, названные
    владельцем при заведении чекера 2026-08-31, в личных формах и инфинитиве:
    отглагольное существительное («вывод прогона») поручением не является.
    Чекер меряет форму раздела, а не полноту перечня: «все ли действия хода
    сюда собраны» из текста не выводится и остаётся за владельцем — как и
    «допустимые попадания» пункта (ход без действий владельца раздела не имеет
    вовсе и не краснеет).
provenance: >-
  Правка канона 2026-08-29 (owner-акт, повод — разбор доставки политики в
  milestone-чате NAV): контракт получил пункт «Действия владельца — отдельным
  блоком, а не прозой». Правило §6 «Инструкция владельцу самодостаточна»
  покрывало полноту инструкции, но молчало о её месте. Первый рецидив —
  2026-08-31, та же сессия, что и инцидент S-07: пункт 4 предыдущего хода был
  выдан прозой, а не блоком, и назван владельцем. Пункт лежит в §7 «Формат
  каждого ответа оркестратора» (строка 113 контракта), а не в §11: повод и
  запись 00-system/log.md:2235 называют §11 — расхождение названия раздела с
  местом пункта; заголовок и хэш взяты по месту. Запись о рецидиве в
  00-system/canon-corrections-register.md §B на момент связывания не сделана —
  занесение за подписью владельца вместе с ходом 10c.
status: active
