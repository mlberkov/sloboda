id: S-10
class: К2
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-RUNID-008
    role: primary
    hash_at_binding: "719d86bae4b995041288c882c34cd31bf90c5d3bfcdf1a39c77ea26bd221f4ae"
  - rule_id: R-PROV-001
    role: secondary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  На ветке возможны прогоны разных событий: `push` и `workflow_dispatch` живут
  на одном и том же sha. Оркестратор собирает владельцу блок, читающий вердикт
  «последнего прогона».
action: >-
  Блок отбирает прогон позицией — `--limit 1`, `head -1`, `.[0]` в jq-выражении —
  и не несёт фильтра ни по событию (`--event`), ни по sha (`--commit`/`headSha`).
expected: >-
  Красный на строке отбора. «Последний» на такой ветке — не тот прогон: возвращается
  push-прогон вместо диспатча на том же коммите, и вердикт строится по чужому
  предмету при формально соблюдённом провенансе. Пункт требует именно пары
  фильтров: событие без sha берёт свежий диспатч чужого коммита, sha без события —
  push-прогон нужного. Оправдание — обе ноги вместе в том же блоке.
oracle:
  type: deterministic
  checker: run_id_filter
  note: >-
    Меряется структурная половина «Проверки» — форма отбора в блоке. Вторая
    половина того же пункта, «вердикт по прогону называет его событие», из
    текста не выводится: вердикт живёт в прозе хода и опознаётся смыслом, а не
    формой; она остаётся за владельцем. «Допустимые попадания» пункта —
    контексты с единственно возможным типом прогона — из артефакта тоже не
    видны: какие события существуют на ветке, текст хода не сообщает. Снимаются
    маркером изъятия с причиной, а не порогом.

    Формы отбора позицией и обеих ног оправдания — данные linter/manifest.yaml,
    расширяются без правки модуля.
provenance: >-
  Повод пункта (§11, 2026-08-22, разбор закрытия L3): на закрытии L3 **дважды** —
  джоба `android-instrumented` искалась как workflow (её дом — `CI`, ветка `if`
  по событию), и `--limit 1` вернул push-прогон вместо диспатча на том же sha.
  Единственный пункт добора, чей «Повод» называет счёт нарушений прямо;
  по этому счёту он и стоит вторым в очереди чекеров после S-14.
  В §B реестра правок канона рецидива по этому правилу не записано.
status: active
