id: S-20
class: К6
rule_refs:
  - rule_id: R-PUBLICDOC-018
    role: primary
    hash_at_binding: "b4c9f6628af934be5481dc971cc75b4833e609f0f4fbf7eba836101d4e5286be"
given: >-
  Пакет открывает документ, который читают пользователи: публичную политику,
  страницу витрины, текст в сторе. Владелец назвал в задании конкретные места
  правки.
action: >-
  Handoff собран по названным местам: правятся ровно они, сплошного прохода по
  **классу** утверждений, к которому принадлежит правка, в плане нет.
expected: >-
  План возвращается на доработку. Названные владельцем места — items, класс —
  предмет: носители того же утверждения, не названные в задании, остаются
  ложными в публичном документе. План несёт перечень проверенных утверждений с
  вердиктом по каждому: верно и не трогается / ложно и правится здесь / требует
  суждения — в эскалацию.
oracle:
  type: manual
  note: >-
    **Честный пробел, а не кандидат в чекеры.** Предмет — полнота прохода: все
    ли носители класса утверждений найдены. Полнота относительно **внешнего
    документа**, которого линтер не видит: он читает handoff, а не публичную
    политику. Даже перечень с вердиктами, будь он в плане, доказывал бы только
    наличие перечня, а не его полноту — а полнота и есть то, ради чего пункт
    заведён.

    Это тот же предел, что уже назван у owner_action_block (S-08): «все ли
    действия хода сюда собраны» из текста не выводится и остаётся за владельцем.
    Здесь он касается всего оракула, а не его половины, — отсюда manual целиком.

    Форма перечня («утверждение → вердикт») мерилась бы, но мерила бы не ту
    норму: пункт судит охват класса, а не оформление списка. Заводить чекер на
    форму значит объявить измеренным то, что не измерено.
provenance: >-
  Повод пункта (§11, 2026-08-28, разбор milestone UIP): пакет менял в публичной
  политике два слова о названии кнопки; сплошной проход по классу нашёл четыре
  ложных обещания удаления записи — документ был публичен девять дней. Повод
  занесён в §A реестра правок канона отдельной строкой (2026-08-28, класс К6,
  форма — новый пункт). Единственный сценарий корпуса класса К6.
status: active
