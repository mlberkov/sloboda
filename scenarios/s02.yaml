id: S-02
class: К1
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-PROV-001
    role: primary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  Артефакт оркестратора несёт одно из трёх: блок стоп-условия (owner-блок «что
  должно совпасть» / «что не должно двигаться») с числовым литералом; числовую
  оценку в утверждении оркестратора («примерно N», «N в неделю», «N из M»);
  адрес пункта канона (§ раздела, путь внутри вольта, «файл.md:строка»,
  «строка N»).
action: >-
  Названное выдано без соседнего провенанса: рядом нет ни команды, его вернувшей,
  ни цитаты выдачи, ни пометки «ожидание», ни пометки «не проверено».
expected: >-
  Красный на строке. Стоп-условие с числом обязано нести вызов, его вернувший,
  либо явную пометку ожидания. Оценка обязана нести измерение либо пометку «не
  проверено»: рамка, введённая оркестратором, читается владельцем как измерение
  и на следующем ходе цитируется как основание. Адрес пункта — такое же
  утверждение о внешнем предмете, как число: §11 вместо §7 неотличим от
  прочитанного, пока рядом не сказано, чем читали.
oracle:
  type: deterministic
  checker: claim_provenance
  note: >-
    Расширен 2026-08-31: чекер `stop_provenance` переименован в
    `claim_provenance` и получил две ноги сверх прежней. Основание — §A реестра
    правок канона (2026-08-31, К1): «расширение чекера `stop_provenance` до
    `claim_provenance`: числовая оценка либо ссылка на пункт канона (§, файл,
    строка) без соседнего провенанса или пометки — красный. Доработка
    существующей механики, текст правила не трогается». На момент записи мера
    числилась структурной, механики за ней не было — этот сценарий её называет.

    Прежняя нога сохранена дословно: те же `block_markers`, то же окно, тот же
    список изъятий, то же сообщение. Расширение не вправе переопределять долг
    §B, закрытый по рецидиву 2 — иначе прогон перестал бы говорить о том, ради
    чего чекер заведён.

    Ноги 2 и 3 меряют прозу хода: строки внутри огороженных блоков не
    рассматриваются (команда и её выдача — не утверждение оркестратора), строки,
    разобранные первой ногой, второй раз не судятся.

    Списки оправданий у ног разные, и это не небрежность. В первой ноге
    `awaiting_pattern` содержит «оценк»: сказать о числе стоп-условия «это
    оценка» значит снять с него притязание. Во второй ноге слова «оценка» в
    оправданиях нет — рецидив 3 состоял ровно в том, что оценка была названа
    оценкой и тут же процитирована как основание выбора дефолта enforcement.

    Чекер меряет соседство провенанса, а не его истинность: действительно ли
    названная команда вернула это число — остаётся за владельцем.
provenance: >-
  00-system/canon-corrections-register.md §B, правило «Провенанс утверждений
  оркестратора» × К1, три рецидива. Счёт 2, 2026-08-27: `AHEAD_OF_MAIN: 7` —
  число посчитано в уме и выдано как стоп-условие, верное значение 6; долг закрыт
  2026-08-31 структурной мерой (чекер + этот сценарий). Счёт 3, 2026-08-31:
  оценка «1–5 правок канона в неделю» введена оркестратором как рамка и
  процитирована как основание выбора дефолта enforcement, пометки «не проверено»
  не было; фактическая опора — единственная точка §D (5 внесено и 3 снято за один
  разбор). Счёт 4, 2026-08-31: адрес пункта «Действия владельца — отдельным
  блоком» назван как §11, тогда как пункт стоит в §7, строка 113; ошибка
  воспроизведена и в логе вольта. По лестнице лечения §B третий рецидив
  дописыванием текста не лечится вовсе — только механикой, не зависящей от
  памяти оркестратора; расширение до `claim_provenance` и есть эта механика.
status: active
