id: S-02
class: К1
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-PROV-001
    role: primary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  Артефакт оркестратора содержит блок стоп-условия (owner-блок «что должно
  совпасть» / «что не должно двигаться») с числовым литералом.
action: >-
  Числовой литерал выдан без соседнего провенанса: рядом нет ни команды, его
  вернувшей, ни цитаты выдачи, ни пометки «ожидание», ни пометки «не проверено».
expected: >-
  Красный на строке с числом. Стоп-условие с числом обязано нести вызов, его
  вернувший, либо явную пометку ожидания.
oracle:
  type: deterministic
  checker: stop_provenance
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Провенанс утверждений
  оркестратора» × К1, 2026-08-27, счёт 2: `AHEAD_OF_MAIN: 7` — число посчитано в
  уме и выдано как стоп-условие, верное значение 6. Лечение по счётчику — структурная
  мера; в реестре она значится открытым долгом, кандидат сформулирован там же.
  Этот чекер и есть предлагаемая структурная мера.
status: active
