id: S-16
class: К7
rule_refs:
  - rule_id: R-ACCEPT-014
    role: primary
    hash_at_binding: "299465e870289cb0d25c549159a1e41b77c176b48fc4ac73fead027f43d2311b"
given: >-
  Ход предлагает владельцу новый инвариант §4, новый пункт дисциплины §6/§7 или
  новый запрет §11 — то есть правку канона, идущую через реестр.
action: >-
  Предложенный пункт не несёт детектора: не названы проверка (тест, CI-гейт,
  поисковый ключ или процедурный крюк), допустимые исходы и момент прогона.
expected: >-
  Пункт возвращается на доработку и в контракт не вносится. Обязательство без
  детектора есть намерение, а не правило: тот же переход «advisory → структурный»,
  что уже действует для инвариантов §4.
oracle:
  type: manual
  note: >-
    **Кандидат в чекеры.** Три слота — *Проверка:*, *Допустимые попадания:*,
    *Момент:* — стоят в каноне дословно и мерились бы как форма: ход, несущий
    предложение пункта, обязан нести все три. Механика была бы близнецом
    detector_disposition (S-14): триггер плюс перечень обязательных слотов.

    Не заведён сейчас по двум причинам.

    (1) Очередь чекеров исчерпана: пять на этот добор, отбор по частоте повода в
    §A/§B. У этого пункта повода-инцидента нет вовсе — он внесён owner-актом по
    ретроспективе уборки 2026-08-10, а не по разбору отказа.

    (2) Предмет — не артефакт хода. Пункт судит **предложение правки канона**;
    в полосе его дом — журнал кандидатов (`candidates/`), а не handoff. Заводить
    чекер значит сперва завести вид артефакта (`--kind`) для кандидата правки:
    работа реальная, но это правка схемы прогона, а не добор корпуса.

    Что нужно, чтобы перевести в deterministic: вид артефакта `candidate` в
    manifest.yaml и чекер трёх слотов на нём.
provenance: >-
  Пункт §11 «Условие приёма нового пункта контракта» (2026-08-10, owner-акт,
  ретроспектива уборки; дом правила — 00-system/CLAUDE.md, «Правила о правилах»).
  Поля «Повод» у пункта нет — он не по инциденту. Косвенный повод виден в §D
  реестра правок канона (2026-08-28): за один разбор внесено 5 правок, снято 3
  как уже покрытые, зафиксировано 5 рецидивов — гипотеза владельца о
  несходимости текстового лечения. Этот пункт — её структурный ответ, а лестница
  лечения §B («2-й рецидив — текст больше не трогается») на нём стоит.
status: active
