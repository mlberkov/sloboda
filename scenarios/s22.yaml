id: S-22
class: К6
rule_refs:
  - rule_id: R-SOURCES-020
    role: primary
    hash_at_binding: "538d69ee84827af40ac3159cb1a4834749ace0a0053454fec4e8e54e4d589def"
  - rule_id: R-PROMPTKIT-019
    role: secondary
    hash_at_binding: "8d4b1f4f04ac161d1557b8b6e688f78dcbd6a96a6a30ec94fbf7fea29be6d41e"
given: >-
  Ход оркестратора несёт копируемый промпт-блок (признак тот же, что у S-21),
  в теле которого закодировано решение вольта: названы ADR/PDR, реестр правок
  канона либо параграф канона.
action: >-
  Блок выдан без строки `Sources` со списком якорей — либо со строкой `Sources`,
  чей слот шаблона не снят и якорей за собой не несёт.
expected: >-
  Красный: на строке открывающей ограды, если строки `Sources` нет вовсе, и на
  самой строке `Sources`, если она есть, но пуста. Агент вольт не читает, и
  трейлер — единственная трасса vault → handoff → план; без него plan review
  сверяет «Decisions & assumptions» плана против пустого списка и всякий план
  выглядит согласованным.
oracle:
  type: deterministic
  checker: sources_trailer
  note: >-
    Трейлер меряется внутри блока, а не в прозе вокруг: он уезжает вместе с
    промптом в чужую сессию — там и должен стоять. Проза хода адресату не видна.

    Незаполненный трейлер — не трейлер, и это не придирка к форме: шаблоны 2/3
    prompt-kit несут слот `- [ADR/PDR/spec ids + one line each on what it
    constrains]`, и промпт, выданный с неснятым слотом, кодирует ровно ноль
    якорей. Поэтому перед счётом якорей одиночные квадратные скобки маскируются;
    двойные (`[[вики-ссылка]]`) — не слот и остаются якорем.

    Чекер меряет наличие якорей, а не их правдивость: действительно ли названный
    ADR ограничивает этот пакет — вопрос plan review контракта §8, второго
    читателя трейлера, названного в самом пункте. §8 отдельным правилом в реестр
    не заведён: сценарий на него как на норму не опирается, а правило без
    активного primary-сценария есть мёртвая норма, то есть шум вместо сигнала.

    «Допустимые попадания» пункта — промпт, не кодирующий решений вольта —
    здесь есть отсутствие триггера.
provenance: >-
  prompt-kit, раздел «Правила использования», пункт «Sources-трейлер» (добавлено
  2026-07-28, У1): packet-handoff'ы шаблонов 2/3 несут заполненный оркестратором
  блок `Sources` — список vault-якорей (ADR/PDR/спека плюс одна строка «что
  ограничивает»), которые handoff кодирует. Класс К6 взят по предмету отказа:
  предъявленный список источников, за которым источников нет, — то же, что
  публичный документ, пройденный по названным местам вместо класса
  (R-PUBLICDOC-018): проверяющий видит форму проверки там, где проверки не было.
  Пункт стоит в prompt-kit маркированным списком; его заведение вместе с
  R-PROMPTKIT-019 потребовало поднять разбор канона до bold_lead_v1.
status: active
