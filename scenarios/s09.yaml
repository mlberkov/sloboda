id: S-09
class: К2
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-VACUUM-007
    role: primary
    hash_at_binding: "99ac8b1bfe56d068373dc3306ca3259738e310459eb3de7dd66792bdeb4bcc1d"
  - rule_id: R-OWNERBLOCK-006
    role: secondary
    hash_at_binding: "e8ab5de80abcfcb4c5508ab820cd58f56449a2ece196e98924ef1509d11453b0"
given: >-
  Линтеру подан артефакт вида handoff, дошедший до прогона без оград: блоки
  развернулись в прозу по дороге — обрезка канала доставки, пересборка разметки,
  копирование хода в чат без огороженных блоков. Раздел «Ваши действия» и
  поручения владельцу в тексте при этом на месте.
action: >-
  Линтер прогоняется на этом артефакте. Пять чекеров полосы опираются на
  огороженный блок как на предмет: smoke_line, stop_provenance, shell_mech,
  env_presupposition, grep_vacuum. Блоков нет — каждый из них возвращает
  ноль находок и завершается штатно.
expected: >-
  Красный класса infra (artifact_degraded) на самом входе, а не зелёный по пяти
  чекерам. Их ноль находок — пустая выдача при нулевом коде выхода: она не
  отрицательный результат, сверка объявляется не выполненной, вердикт по ней не
  строится. Перечисленные чекеры на таком входе не запускаются вовсе, и отчёт
  несёт по ним «не измерено», а не «ноль находок». Лечение — добыть артефакт
  другим путём (исходная выдача хода, файл без пересборки разметки) и повторить
  прогон.
oracle:
  type: deterministic
  checker: artifact_integrity
  note: >-
    Это применение пункта канона к самому линтеру. Линтер — инструмент чтения
    наравне с логом, API и файлом, о которых говорит пункт; его «ноль находок»
    на артефакте, где мерить нечего, есть ровно та пустая выдача при нулевом
    коде выхода, интерпретацию которой пункт запрещает. Отсюда класс отказа —
    infra: отказала опора прогона, а не предмет под чекером.

    Признак деградации — ноль огороженных блоков при одном из двух: есть раздел
    «Ваши действия» (форма §7, ссылка secondary) либо в тексте не меньше двух
    глаголов исполнения из словаря owner_action_block. Словарь один на двоих и
    живёт в `shared` манифеста: две копии разошлись бы молча, и анти-вакуумная
    нога перестала бы видеть ровно те поручения, по которым краснеет
    owner_action_block.

    Гашение исполняет run.py по списку `gates` в linter/manifest.yaml — данные,
    не код: чекер, переставший опираться на блок, снимается оттуда без правки
    модулей. Считается оно по сырой находке гейта, до маркеров изъятия:
    `lint:ignore` снимает красный, но оград в артефакте от этого не появляется.

    «Допустимые попадания» пункта здесь — ход без действий владельца: он не
    несёт ни раздела, ни двух глаголов, и отсутствие блоков в нём законно.

    Область: только вид handoff. В задании (`--kind spec`) огороженный блок не
    обязателен — задание ходом не является и блоков владельцу не выдаёт.
provenance: >-
  Решение оркестратора 2026-08-31 при заведении анти-вакуумной ноги линтера.
  Повод — не инцидент вольта, а разбор собственной диспозиции полосы: пять
  чекеров из девяти читают только огороженный блок, и на артефакте без оград
  прогон выдал бы зелёный по всем пяти. Ровно эту неотличимость — «ноль
  находок» от «мерить было нечем» — полоса и заведена ловить в чужих ходах;
  правило канона «пустая выдача при нулевом коде выхода — отказ канала»
  применено к самому линтеру. Пункт лежит в §11 контракта, строка 202;
  запись о заведении в 00-system/canon-corrections-register.md §A на момент
  связывания не сделана — занесение за подписью владельца отдельным ходом.
status: active
