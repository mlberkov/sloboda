id: S-03
class: К2/К3
rule_id: R-SHELL-003
rule_hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Артефакт содержит блок `Handoff for shell`, в котором есть строка в
  предпосылочной форме: она адресуется к состоянию среды по имени, взятому не из
  измерения этого хода.
action: >-
  Блок выдаётся владельцу без предшествующей измеряющей строки, которая это
  состояние вернула бы (список сервисов, список устройств, путь интерпретатора).
expected: >-
  Красный на предпосылочной строке. Блок обязан измерять свои предпосылки выше по
  тексту того же блока; иначе он падает на предпосылке, а не на предмете, и провал
  неотличим от отсутствия предмета.
oracle:
  type: deterministic
  checker: env_presupposition
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Исполнимость shell-блока»,
  вопрос 2 × К2/К3, 2026-08-28, счёт 1: имя сервиса Cloud Run (`theygrow-web`) взято
  по памяти, блок упал на предпосылке. Местная история инцидента: `pip install --user`
  в среде PEP 668 — провал на предпосылке о том, что вне venv установка разрешена.
status: active
