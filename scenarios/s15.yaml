id: S-15
class: К2
rule_refs:
  - rule_id: R-GITGREP-013
    role: primary
    hash_at_binding: "190a9149c1c215223590c56f6921998d129b50725e399e5eafcead041401530d"
  - rule_id: R-SMOKE-004
    role: secondary
    hash_at_binding: "5f9a372423d35979038753a51bafb5c1e7a19763b3ca215ff6d575cfa84c541a"
given: >-
  Стоп-условие или сверка в handoff-блоке имеет предметом содержимое
  **репозитория**, а в дереве живут неотслеживаемые каталоги сборки
  (вывод `cap sync`, `dist/`, `build/`).
action: >-
  Сверка построена на файловом grep по дереву (`grep -r`, `rg`), а не на
  `git grep` либо `git ls-files` с фильтром.
expected: >-
  Красный на строке сверки. Файловый grep видит неотслеживаемые артефакты
  сборки и даёт ложные срабатывания, неотличимые от настоящих; ложный STOP
  разбирается как дефект условия, а не как находка в предмете.
oracle:
  type: manual
  note: >-
    **Кандидат в чекеры.** Форма нарушения из текста видна: файловый grep внутри
    блока со стоп-условием, при отсутствии `git grep`/`git ls-files`. Не заведён
    сейчас по двум причинам, и вторая — принципиальная.

    (1) Очередь. По частоте повода в §A/§B этот пункт стоит ниже пяти заведённых:
    его повод — один случай, в §A/§B он не занесён.

    (2) Оправдывающей формы нет. «Допустимые попадания» пункта — сверки, чей
    предмет именно диск (наличие артефакта сборки, состояние выгрузки), — и от
    настоящего отказа они отличаются **предметом сверки**, а не формой команды:
    `grep -r` в обоих случаях выглядит одинаково. Ни один признак в тексте
    артефакта не отделяет «предмет — репозиторий» от «предмет — диск». Чекер
    пришлось бы либо краснить на законных сверках диска, либо угадывать
    намерение по соседним словам — это и есть изобретение эвристики, которого
    сценарий не делает.

    Что нужно, чтобы перевести в deterministic: структурная мера в §A — слот,
    называющий предмет сверки («предмет: репозиторий» / «предмет: диск»), по
    образцу слота «Каналы: X, Y», внесённого для S-01. Тогда мерится форма, а не
    догадка. До внесения такой меры сценарий держится разбором.
provenance: >-
  Повод пункта (§11, 2026-08-23, разбор milestone PPR): замена имени контролёра
  остановилась ложным STOP на двух копиях `privacy.html` из `.gitignore`-каталогов.
  Тот же разбор внёс «Строку смоука» (S-06) — отсюда secondary-ссылка на R-SMOKE-004.
status: active
