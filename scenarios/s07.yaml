id: S-07
class: К3
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-SHELL-003
    role: primary
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Артефакт хода несёт блок, помеченный как исполняемый в bash/WSL — оградой с
  языком либо маркером `Handoff for shell`, — и владелец отправляет его в
  терминал целиком, как блок и предполагает.
action: >-
  В блоке стоит одна из двух форм: (а) путь Windows-вида — буква диска,
  двоеточие, бэкслеш (`D:\Obsidian\TheyGrow`); (б) `cd` последней командой
  строки, не сцепленный `&&` со следующей командой блока.
expected: >-
  Красный на строке формы. (а) Бэкслеши съедает оболочка: до `cd` доходит
  `D:ObsidianTheyGrow`, каталога с таким именем нет, `cd` падает; в WSL диск
  адресуется как `/mnt/d/…`. (б) Провал `cd` остаток блока не останавливает:
  он отрабатывает в текущем каталоге и печатает правдоподобный успех. В обоих
  случаях провал становится неотличим от успеха — ровно то, что «Исполнимость
  shell-блока» запрещает вопросом (4). Оправдания: `&&`/`||` на той же строке,
  `set -e` выше по блоку, отсутствие команд ниже по блоку.
oracle:
  type: deterministic
  checker: shell_mech
  note: >-
    Формы `windows_path` и `cd_without_chain` в linter/manifest.yaml — данные:
    шаблоны и оправдания правятся там, без правки модуля. Обе смотрят только на
    команды блока: тело heredoc — вставляемый текст, в нём ни путь, ни `cd` не
    исполняются. Чекер меряет форму строки, а не действительный каталог
    владельца: существо (тот ли это каталог) остаётся за владельцем.
provenance: >-
  Инцидент 2026-08-31 (полоса «Система», сессия калибровки): блок коммита вольта
  написан в Windows-синтаксисе и исполнен в bash. `cd D:\Obsidian\TheyGrow` съел
  бэкслеши и упал — `bash: cd: D:ObsidianTheyGrow: No such file or directory`, —
  а остаток блока отработал в текущем каталоге и вернул «nothing to commit,
  working tree clean / Everything up-to-date» из постороннего репозитория:
  владелец получил правдоподобный зелёный. Разбор назвал это «К3 в чистом виде и
  одновременно четвёртым случаем правила о предпосылках среды»; механика S-03
  случай не поймала, потому что не знает ни о смешении синтаксисов путей, ни о
  `cd` без сцепки. На момент связывания запись об этом рецидиве в
  00-system/canon-corrections-register.md §B ещё не сделана — занесение идёт за
  подписью владельца вместе с ходом 10c; здесь фиксируется структурная мера, а
  не текст канона.
status: active
