id: S-05
class: К4
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-TURN-005
    role: primary
    hash_at_binding: "445ed61c9b73d5da3360401948caa248675c29c4f73b5c83db095db0e3170397"
given: >-
  Ход оркестратора завершён handoff-артефактом, переданным владельцу.
action: >-
  Артефакт либо вовсе не содержит строки «Конец хода», либо содержит её, но не
  называет, какое именно слово владельца требуется: после двоеточия меньше десяти
  значащих символов («Конец хода:», «Конец хода: —», «Конец хода: ok»).
expected: >-
  Красный. Ход заканчивается только в точке, где от владельца требуется слово, и эта
  точка названа явно: что именно владелец должен сказать или решить.
oracle:
  type: mixed
  checker: turn_end
  note: >-
    Чекер закрывает структурную половину: наличие строки и непустоту требования
    после двоеточия. Существо — действительно ли в этой точке нужно слово владельца,
    а не работа оркестратора — судится владельцем и остаётся manual.
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Конец хода — точка, где нужно
  слово владельца» × К4, 2026-08-25, счёт 1: ход закончен там, где от владельца ничего
  не требовалось; поймано владельцем, не оркестратором. Правило внесено и нарушено в
  той же сессии — признак, что его удержание зависит от свежести чтения, то есть
  требует структурной опоры, а не текста.
status: active
