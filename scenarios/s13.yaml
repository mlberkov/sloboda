id: S-13
class: К2
rule_refs:
  - rule_id: R-WHITESPACE-011
    role: primary
    hash_at_binding: "7d810c9e51ddb70738262c3c8ebd5c26e246a2b7cea1fd195d9e5f35e6aca8e6"
  - rule_id: R-PROV-001
    role: secondary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  Ход сверяет правку файла и выдаёт владельцу блок, читающий её объём:
  `git diff --stat` (или `--numstat`, `--shortstat`, `git show --stat`).
action: >-
  В том же блоке нет диффа под фильтром пробелов (`-w`, `-b`,
  `--ignore-all-space`, `--ignore-space-change`, `--ignore-cr-at-eol`), и рядом
  с блоком нет пометки, что вывод делается только о факте различия.
expected: >-
  Красный на строке счётчика. Равное число вставок и удалений есть подпись
  построчной перезаписи — концы строк, кодировка, нормализация редактором, — а
  не правки. Отказ ловится в обе стороны: перезапись читается как содержательная
  правка, либо настоящая правка прячется в шуме перезаписи. Блок с одним
  счётчиком отвечает на вопрос «файл отличается от `HEAD`», а выдаётся под
  вопрос «что в нём изменилось».
oracle:
  type: deterministic
  checker: whitespace_diff
  note: >-
    Предмет измерения — блок, а не утверждение. «Утверждение о содержании»
    смыслом из текста не опознаётся, поэтому чекер меряет наличие счётчика без
    фильтра; половина «Проверки» — «утверждение о содержании сопровождается
    прогоном с фильтром» — остаётся за владельцем.

    «Допустимые попадания» пункта (утверждения вида «файл отличается от `HEAD`»
    без притязания на содержание) опознаются формой: пометка в прозе вокруг
    блока (`hedge_patterns`), а не догадкой о намерении. Порогом это не чинится:
    сузить триггер под намерение значит перестать видеть настоящий отказ.
provenance: >-
  Повод пункта (§11, 2026-08-25, разбор сессии security-каденции): вывод «файл
  изменён» был сделан по `--stat` без фильтра, где равные вставки и удаления
  были подписью построчной перезаписи. Тот же разбор внёс «Конец хода — точка,
  где нужно слово владельца» (S-05). Пункт объявлен уточнением провенанса
  утверждений — отсюда secondary-ссылка на R-PROV-001.
status: active
