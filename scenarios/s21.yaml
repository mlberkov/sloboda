id: S-21
class: К4
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-PROMPTKIT-019
    role: primary
    hash_at_binding: "8d4b1f4f04ac161d1557b8b6e688f78dcbd6a96a6a30ec94fbf7fea29be6d41e"
  - rule_id: R-PROV-001
    role: secondary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  Ход оркестратора несёт огороженный блок, который целиком копируется и уезжает
  из этого чата: промпт агенту вне Claude Code, самому Claude Code по шаблонам
  1/2/3 либо передаточный опенер следующей сессии. Признак блока — длина сверх
  15 строк и адресация исполнителю («Задача:», «Твоя задача», «Your task»,
  «В ~/»).
action: >-
  Ход выдаёт блок, не называя рядом ни списка критериев, по которым промпт
  оценивался, ни числа самооценки 0–100.
expected: >-
  Красный на строке открывающей ограды, с перечнем недостающего. Адресат не
  видел чата, в котором промпт собирался, и проверить его утверждения ему нечем:
  правдоподобный путь или URL, собранный редактированием другого, внутри
  копируемого блока уезжает в сессию, где его никто не сверит.
oracle:
  type: deterministic
  checker: prompt_self_assessment
  note: >-
    Оракул взят из самого пункта, поле «Проверка»: «ход с промптом содержит
    список критериев и число; промпт без них возвращается». Из трёх обязанностей
    пункта мерится третья — та, у которой оракул есть. Первые две («фактические
    параметры одним блоком принимай как данность», «явный формат выхода») из
    текста промпта механически не отличимы от прозы и остаются за владельцем;
    сужение намеренное — чекер меряет наличие слотов, а не их правдивость, тем
    же приёмом, каким S-01 переведён в deterministic.

    Число ищется на строке, несущей форму самооценки, и обязано лежать в 0–100:
    «самооценка по 4 критериям» — счёт критериев, а не оценка, и диапазон здесь
    единственная мера, различающая одно от другого.

    Критерии и число ищутся в прозе хода вокруг блока, вне любых оград. Внутри
    блока их искать нельзя: самооценка адресована владельцу и в чужую сессию не
    уезжает — число внутри копируемого блока есть часть промпта.

    Блоки с shell-языком в ограде исключены: команда владельцу не промпт другому
    агенту, и её длина о промпте ничего не говорит.

    «Допустимые попадания» пункта — короткий go-ahead шаблона 4 и корректирующие
    реплики без фактических параметров — здесь есть отсутствие триггера.

    Признак копируемого промпта общий с S-22 и живёт в `shared` манифеста: две
    копии разошлись бы молча, и один чекер перестал бы видеть ровно те блоки, по
    которым краснеет другой.
provenance: >-
  prompt-kit, раздел «Правила использования», пункт «Промпт как копируемый
  артефакт — с параметрами и самооценкой»: добавлен 2026-08-23 по разбору
  milestone PPR, область расширена 2026-08-25 сессией создания аккаунта Play на
  любой промпт, покидающий текущий чат. Повод назван в самом пункте: за PPR три
  ad-hoc промпта, и самооценка каждый раз находила дефект до эмиссии (86 —
  отсутствие дат чтения; 89 — незакрытый механизм отзыва согласия; 87 —
  отсутствие поведения при неготовности референсов); в сессии Play первый проход
  передаточного опенера дал 84 — угаданный raw-путь к workflow, версия сборки,
  выданная за факт, и неназванное поведение при недоступности браузерного канала.
  Пункт стоит в prompt-kit, а не в контракте: его заведение потребовало поднять
  разбор канона до bold_lead_v1 — раздел «Правила использования» есть
  маркированный список, и для bold_lead_v0 этого пункта не существовало.
status: active
