id: S-18
class: К5
rule_refs:
  - rule_id: R-VAULTIO-016
    role: primary
    hash_at_binding: "7bd8f227020e34c7bb45bf3d05d11fb70bfe1c9be4df9cde5cf8d1b179300d74"
given: >-
  Ход пишет в вольт — создаёт или правит файл канона. В окружении оркестратора
  сосуществуют одноимённые файловые инструменты разных носителей: неймспейс
  `filesystem:*` ведёт в вольт, а `create_file`/`str_replace`/`bash` без
  префикса — в контейнерную песочницу.
action: >-
  Запись выполнена не-`filesystem:*` инструментом. Вызов принимает путь, не
  жалуется и возвращает успех — но пишет в песочницу; в вольте файла нет.
expected: >-
  Запись объявляется не выполненной, и ход не фиксирует созданный файл в логе.
  Отказ ловится тем, что успех инструмента неотличим от успеха записи в вольт:
  подтверждение приходит от чужого носителя.
oracle:
  type: manual
  note: >-
    **Честный пробел, а не кандидат в чекеры.** Предмет правила — вызов
    инструмента, сделанный самим оркестратором. В тексте выданного артефакта
    его нет вовсе: ход сообщает «файл записан», и по какому носителю прошла
    запись, из текста не выводится ни формой, ни словом. Оракула на тексте
    артефакта не существует — не «пока не придумали», а по устройству предмета.

    Соседний случай, который *был бы* мерим, сюда не относится и подменой не
    заводится: shell-блок, поручающий владельцу править вольт своими руками, —
    это другой отказ (владелец пишет мимо собственных инструментов оркестратора),
    и своего пункта в каноне он не имеет. Заводить чекер на него значит мерить
    не ту норму, на которую сценарий сослался.

    Что нужно, чтобы это стало измеримым: не правка линтера, а структурная мера
    в §A — обязательная пометка носителя в ходе с vault-записью («записано
    `filesystem:write_file`»), по образцу слота «Каналы: X, Y» для S-01. Тогда
    мерилась бы пометка. До внесения такой меры сценарий держится разбором.
provenance: >-
  Пункт §7 «Верность носителю при vault-записи» (предусловие, добавлено
  2026-07-02). Поля «Повод» у пункта нет — он внесён как предусловие. Класс К5
  («Безопасная запись») в §A/§B встречается один раз: 2026-08-28, замена
  формулировки в CLAUDE.md п. 8а (сессия шла трое суток, от «сегодня» зависел
  публичный литерал даты). Это единственный сценарий корпуса класса К5.
status: active
