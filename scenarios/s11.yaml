id: S-11
class: К3
rule_refs:
  - rule_id: R-DOWNLOAD-009
    role: primary
    hash_at_binding: "7552baff15a260f2e1eb72ca42d1645a5d947db671b5d7ec7234839e716ec23a"
  - rule_id: R-SHELL-003
    role: secondary
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Handoff-блок выгружает владельцу артефакты прогона или ассеты релиза
  (`gh run download`, `gh release download` либо аналог).
action: >-
  Вызов выгрузки не несёт каталога назначения вовсе — либо несёт `-D` с
  относительным путём: каталог назначения оказывается внутри рабочего дерева.
expected: >-
  Красный на строке выгрузки. Артефакты лягут в репозиторий мимо `.gitignore` и
  уедут в коммит на первом `git add -A`; в отличие от прочих пунктов §11, у
  этого поле «Допустимые попадания» пустое — оправдывающей формы нет вовсе,
  снятие возможно только маркером изъятия с причиной.
oracle:
  type: deterministic
  checker: download_dir
  note: >-
    Две формы одного отказа: `-D`/`--dir` отсутствует и `-D` с относительным
    путём. «Вне дерева» опознаётся по началу пути (`outside_prefixes`: `/`, `~`,
    `$TMPDIR`, `$(mktemp …)`) — линтер читает текст артефакта, а не файловую
    систему; абсолютный путь внутрь клона (`-D /home/dev/altrego/tmp`) чекером
    не ловится и остаётся за владельцем. Граница названа здесь, а не спрятана
    в пороге.
provenance: >-
  Повод пункта (§11, 2026-08-22, разбор закрытия L3): шесть каталогов артефактов,
  включая релизный APK, легли в корень рабочего дерева, не были в `.gitignore` и
  уцелели только потому, что коммиты собирались перечислением путей, а не
  `git add -A`. Пункт внесён тем же разбором, что и «Пустая выдача при нулевом
  коде выхода» (S-09) и «Идентификатор прогона» (S-10), и объявлен дополнением к
  «Исполнимости shell-блока» — отсюда secondary-ссылка на R-SHELL-003.
status: active
