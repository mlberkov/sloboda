id: S-17
class: К4
rule_refs:
  - rule_id: R-BILINGUAL-015
    role: primary
    hash_at_binding: "628949ee0c9db41e8dffa4d2e712034c3a721bdc5b7d2a5b4d10d94438d79c76"
  - rule_id: R-OWNERBLOCK-006
    role: secondary
    hash_at_binding: "e8ab5de80abcfcb4c5508ab820cd58f56449a2ece196e98924ef1509d11453b0"
given: >-
  Ход оркестратора несёт handoff-блок: prompt для Claude Code, execution
  go-ahead либо git-команды владельцу.
action: >-
  Блок написан не по двуязычному режиму: русский текст внутри блока,
  предназначенного исполнителю, либо блок не помечен перед оградой — из текста
  не видно, handoff это для Claude Code или для shell.
expected: >-
  Красный на ограде блока. Framing и пояснения — русские, блок — английский и
  явно помеченный; иначе владелец не отличает копируемое от читаемого, а
  исполнитель получает инструкцию на языке, для него не предназначенном.
oracle:
  type: manual
  note: >-
    **Кандидат в чекеры.** Обе половины меримы формой: кириллица внутри блока,
    помеченного как handoff, и отсутствие маркера перед оградой. Опора уже есть
    в данных — `shared.handoff_markers` в linter/manifest.yaml.

    Не заведён сейчас по двум причинам.

    (1) Очередь и частота повода. Это единственный пункт добора **без поля
    «Повод»**: внесён 2026-06-29 как форма, а не по разбору отказа; в §A и §B
    реестра правок канона он не встречается ни разу. По заданному критерию
    отбора он последний из детерминируемых кандидатов.

    (2) Радиус. Чекер покраснел бы на собственных фикстурах полосы и на
    калибровочных артефактах: их блоки несут русские `echo` и не помечены
    маркерами handoff. Это были бы **настоящие** находки, не ложные, — но
    приводить корпус в порядок под новый чекер надо отдельным ходом с
    наблюдённой диспозицией по S-14, а не попутно добору.

    Что нужно, чтобы перевести в deterministic: ход, вводящий чекер вместе с
    приведением фикстур, с названными мутацией и обеими диспозициями.
provenance: >-
  Пункт §7 «Двуязычный режим» (добавлено 2026-06-29) — часть исходной триады
  формата ответа, рядом с которой лежит «Действия владельца — отдельным блоком,
  а не прозой» (S-08); отсюда secondary-ссылка на R-OWNERBLOCK-006. Поля «Повод»
  у пункта нет: он описывает форму, а не лечит инцидент.
status: active
