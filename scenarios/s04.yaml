id: S-04
class: К2
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-SHELL-003
    role: primary
    # механическая опора: «Отличимость провала» / «Полнота отрицания»
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
  - rule_id: R-SMOKE-004
    role: secondary
    # предмет пункта о смоуке; на расхождение хэшей и «мёртвую норму» не влияет
    hash_at_binding: "5f9a372423d35979038753a51bafb5c1e7a19763b3ca215ff6d575cfa84c541a"
given: >-
  Блок `Handoff for shell` (или проверочная строка смоука) содержит вызов `grep`
  или `rg` — поиск, чья выдача читается как факт о предмете.
action: >-
  У поиска нет анти-вакуумной ноги: ни `|| echo`/`|| printf`-маркера отрицания, ни
  проверки непустоты входа (счёт строк, `test -s`, `wc -l`) — нулевая выдача
  неотличима от отсутствия предмета, от несовпавшего шаблона и от пустого входа.
expected: >-
  Красный на строке поиска. Отрицание доказывается ровно двумя способами: явным
  «none»/«совпадений не найдено» от инструмента либо счётом попаданий, взятым из
  измеренного непустого входа.
oracle:
  type: deterministic
  checker: grep_vacuum
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Строка смоука исполняется на
  предмете до выдачи» × К2, 2026-08-28, счёт 1: шаблон грепа построен на невиданной
  разметке страницы, пустая выдача едва не прочитана как факт. Механическая опора —
  контракт §11, «Исполнимость shell-блока» (3)/(3а)/(3б) «Отличимость провала» и
  «Полнота отрицания»; здесь она применена к предмету пункта о смоуке.
status: active
