id: S-12
class: К3
rule_refs:
  - rule_id: R-GHREPO-010
    role: primary
    hash_at_binding: "01819a919197628aaac109b478fa7afe3a0e49f04aca63b8c997f99b581a5fad"
  - rule_id: R-SHELL-003
    role: secondary
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Handoff-блок перед работой с `gh` уходит в каталог-черновик вне рабочего
  дерева — `cd /tmp/...`, `cd "$TMPDIR"`, `cd "$(mktemp -d)"` — например, чтобы
  выгрузить туда артефакты по S-11.
action: >-
  Ниже по блоку стоит `gh`-команда без явного `--repo <owner>/<repo>` и без
  `GH_REPO=` выше по блоку.
expected: >-
  Красный на строке `gh`. Без git-контекста `gh` не определяет репозиторий и
  падает на этом, а не на предмете: владелец получает `failed to determine base
  repo` и раунд, потраченный на дефект блока. Это тот же класс отказа, что
  ловит третий вопрос «Исполнимости shell-блока» — провал блока неотличим от
  отсутствия предмета.
oracle:
  type: deterministic
  checker: gh_repo_scope
  note: >-
    Граница меры названа прямо: «вне дерева» опознаётся по перечню каталогов-
    черновиков из манифеста (`/tmp`, `/var/tmp`, `$TMPDIR`, `$(mktemp …)`, `cd ..`),
    а не разбором файловой системы. `cd ~/другой-репозиторий` — переход в другое
    дерево, а не выход из дерева, и здесь не краснеет: какой каталог является
    рабочим деревом этого хода, из текста артефакта не выводится. Эта половина
    остаётся за владельцем — честный пробел внутри детерминированного оракула,
    а не повод расширять список догадкой.

    Оправдания: `--repo`/`-R` на самой строке либо `GH_REPO=` выше по блоку —
    переменная окружения даёт `gh` тот же контекст.
provenance: >-
  Повод пункта (§11, 2026-08-23, разбор milestone PPR): выгрузка ассетов релиза
  `v0.1.221` в `/tmp` упала с `failed to determine base repo` — раунд потерян на
  дефекте блока, не предмета. В §B реестра правок канона рецидива по этому
  правилу не записано; в §A его повод тоже не заведён — пункт внесён разбором
  PPR напрямую в контракт.
status: active
