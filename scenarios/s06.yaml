id: S-06
class: К2
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-SMOKE-004
    role: primary
    hash_at_binding: "5f9a372423d35979038753a51bafb5c1e7a19763b3ca215ff6d575cfa84c541a"
given: >-
  Handoff-артефакт хода содержит строку смоука — проверочную строку, которую
  оркестратор выдаёт владельцу для исполнения на предмете.
action: >-
  Строка выдана без цитаты своего фактического вывода на предмете и без пометки
  «не исполнялась — первый прогон у владельца» с названным ожиданием: рядом стоит
  только ожидание, написанное из головы, либо пометка без ожидания вовсе.
expected: >-
  Красный на строке смоука. Handoff со строкой смоука либо цитирует её
  фактический вывод на предмете, либо несёт пометку «не исполнялась — первый
  прогон у владельца» с названным ожиданием; строка без того и другого
  возвращается на исполнение. Ожидание из головы неотличимо от измеренного —
  ровно эту неотличимость пункт и запрещает.
oracle:
  type: deterministic
  checker: smoke_line
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Строка смоука исполняется
  на предмете до выдачи» (2026-08-23) × К2, 2026-08-28, счёт 1: шаблон грепа
  построен на невиданной разметке страницы, пустая выдача едва не прочитана как
  факт; правило в тот же день дополнено текстом (канальная композиция, §A К3) —
  дописывание, а не механика. До этого сценария R-SMOKE-004 не держал ни один
  активный сценарий с ролью primary: S-04 ссылается на пункт secondary, механическая
  опора у него другая (R-SHELL-003). Прогон --full числил норму мёртвой. Сценарий
  закрывает её работой по предмету самого пункта — исполнением строки до выдачи, —
  а не перепривязкой ролей у существующего сценария.
status: active
